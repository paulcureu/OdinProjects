<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Library</title>
</head>
<body>
    <h1>Welcome to Library</h1>
    <div class="center">
        <button class = "btn">Add Book</button>
    </div>

    <div class = "center">
        <form action = "/process_form" method="post" class = "AddBook" id = "new-book">
            <label for="bookTitle">Book Title:</label><br>
            <input type="text" id="bookTitle" name="bookTitle"><br>
            <label for="author">Author:</label><br>
            <input type="text" id="author" name="author"><br>
            <label for="pages">Pages:</label><br>
            <input type="number" id="pages" name="pages"><br>
            <label for = "readIt">Read It?</label>
            <input class = "checkbox" id = "readIt" type = "checkbox" name = "ReadIt" value = "ReadIt"><br>
            <input class = "btn btn-submit" type = "submit" value = "Add book">
        </form>
    </div>
    <div id = "library">

    </div>

    <script src="main.js"></script>
</body>
</html>
